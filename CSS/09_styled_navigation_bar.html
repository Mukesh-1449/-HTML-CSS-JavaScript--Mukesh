<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>09 - Styled Navigation Bar</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .navbar { background-color: #1a252f; overflow: hidden; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .navbar .brand { color: white; font-size: 1.2rem; font-weight: bold; text-decoration: none; }
        .navbar nav { display: flex; }
        .navbar a { color: #ecf0f1; text-align: center; padding: 16px 20px; text-decoration: none; transition: 0.3s; }
        .navbar a:hover { background-color: #3498db; color: white; }
    </style>

<style id="site-navigation-style">
.site-nav{position:sticky;top:0;z-index:9999;background:rgba(15,23,42,.96);backdrop-filter:blur(10px);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 3px 14px rgba(0,0,0,.18);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.site-nav .brand{color:#fff;font-weight:800;text-decoration:none;font-size:15px;letter-spacing:.2px}
.site-nav .links{display:flex;gap:8px;flex-wrap:wrap}
.site-nav .links a{color:#fff!important;text-decoration:none!important;padding:7px 11px;border-radius:8px;background:#334155;font-size:13px;font-weight:600}
.site-nav .links a:hover{background:#4f46e5}
.site-footer{margin-top:40px;padding:20px;text-align:center;color:#64748b;font:13px system-ui,-apple-system,Segoe UI,sans-serif}
</style>
</head>
<body><nav class="site-nav">
<a class="brand" href="../index.html">WTIP Practical Programs</a>
<div class="links">
<a href="../index.html">Home</a>
<a href="index.html">CSS Programs</a>
</div>
</nav>

<footer class="site-footer">HTML • CSS • JavaScript Practical Programs · 210 Experiments</footer></body>
</html>
